<!doctype html><html><head><meta charset="utf-8"><meta name="referrer" content="strict-origin-when-cross-origin"><title>XRP Tracker TV</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}iframe{border:0;width:100%;height:100%}</style></head><body>
<script>/* Hosted wrapper (https) so official YouTube live embeds get a proper origin; the dashboard itself runs from a local file. */
const q=new URLSearchParams(location.search), id=(q.get('c')||'').replace(/[^\w-]/g,''), mute=q.get('m')!=='0';
const f=document.createElement('iframe'); f.allow='autoplay; encrypted-media; picture-in-picture'; f.allowFullscreen=true;
f.src='https://www.youtube.com/embed/live_stream?channel='+id+'&autoplay=1&playsinline=1&rel=0&enablejsapi=1&mute='+(mute?1:0)+'&origin='+encodeURIComponent(location.origin);
document.body.appendChild(f);
const cmd=(func,args)=>f.contentWindow&&f.contentWindow.postMessage(JSON.stringify({event:'command',func,args:args||[]}),'*');
f.onload=()=>{ f.contentWindow.postMessage(JSON.stringify({event:'listening'}),'*'); };
addEventListener('message',e=>{ const d=e.data; if(!d||!d.tv) return; if(d.tv==='mute') cmd('mute'); else if(d.tv==='unmute'){ cmd('unMute'); cmd('playVideo'); } else if(d.tv==='vol') cmd('setVolume',[d.v|0]); });
</script></body></html>
